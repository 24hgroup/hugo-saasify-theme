<section class="py-12 border-y border-gray-100 bg-white overflow-hidden">
    <div class="container mx-auto px-4">
        <p class="text-center text-xs sm:text-sm font-bold uppercase tracking-widest text-gray-400 mb-8">
            {{ .Get "title" | default "Kết nối đồng bộ với các nền tảng & đơn vị vận chuyển hàng đầu" }}
        </p>
        <div class="logo-scroll">
            <div class="logos-slide{{ if ne (.Get "animate" | default "true") "false" }} animate{{ end }}">
                {{ range .Page.Params.client_logos }}
                <img src="{{ .logo | relURL }}" class="partner-logo" alt="{{ .name }}" title="{{ .name }}" />
                {{ end }}
                {{ if ne (.Get "animate" | default "true") "false" }}
                    {{ range .Page.Params.client_logos }}
                    <img src="{{ .logo | relURL }}" class="partner-logo" alt="{{ .name }}" title="{{ .name }}" />
                    {{ end }}
                {{ end }}
            </div>
        </div>
    </div>
</section>

<style>
.logo-scroll {
    overflow: hidden;
    padding: 10px 0;
    white-space: nowrap;
    position: relative;
    mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
}

.logo-scroll.static {
    display: flex;
    justify-content: center;
    overflow: visible;
}

.logo-scroll.static .logos-slide {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 40px;
}

.logos-slide {
    display: inline-block;
}

.logos-slide.animate {
    animation: 25s slide infinite linear;
}

.partner-logo {
    height: 2.75rem;
    max-height: 2.75rem;
    width: auto;
    object-contain: fit;
    margin: 0 35px;
    display: inline-block;
    vertical-align: middle;
    filter: grayscale(30%);
    opacity: 0.8;
    transition: all 0.2s ease-in-out;
}

.partner-logo:hover {
    filter: grayscale(0%);
    opacity: 1;
    transform: scale(1.08);
}

.logo-scroll.static .logos-slide img {
    margin: 0;
}

@keyframes slide {
    from {
        transform: translateX(0);
    }
    to {
        transform: translateX(calc(-100% / 2));
    }
}

.logo-scroll:hover .logos-slide.animate {
    animation-play-state: paused;
}

/* Mobile-specific animation speed */
@media (max-width: 768px) {
    .logos-slide.animate {
        animation: 15s slide infinite linear;
    }
    .partner-logo {
        height: 2rem;
        max-height: 2rem;
        margin: 0 20px;
    }
}
</style>
