{{ $data := .Inner | transform.Unmarshal }}
<section class="py-12 md:py-16 bg-white">
    <div class="container mx-auto px-4 max-w-4xl">
        <div class="text-center mb-12">
            <span class="inline-block px-3.5 py-1 rounded-full bg-primary-100 text-primary-700 text-xs font-bold uppercase tracking-wider mb-3">Hỗ trợ & Thắc mắc</span>
            <h2 class="text-3xl md:text-5xl font-black text-gray-900 tracking-tight mb-4">{{ $data.title | default "Câu hỏi thường gặp" }}</h2>
            {{ with $data.description }}
            <p class="text-base sm:text-lg text-gray-600 leading-relaxed max-w-2xl mx-auto">{{ . }}</p>
            {{ end }}
        </div>
        
        <div class="space-y-4">
            {{ range $data.questions }}
            <div class="border border-gray-200 rounded-2xl overflow-hidden bg-white shadow-xs hover:border-primary-300 hover:shadow-md transition-all duration-200">
                <button class="w-full flex justify-between items-center p-5 sm:p-6 text-left hover:bg-slate-50/80 transition-colors duration-200 focus:outline-none gap-4" 
                        onclick="const content = this.parentElement.querySelector('.faq-content');
                                 content.classList.toggle('hidden');
                                 this.querySelector('.faq-icon').classList.toggle('rotate-180');
                                 this.classList.toggle('bg-slate-50');">
                    <span class="text-base sm:text-lg font-bold text-gray-900 leading-snug">{{ .question }}</span>
                    <span class="flex-shrink-0 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-gray-500">
                        <svg class="w-4 h-4 faq-icon transform transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </span>
                </button>
                <div class="faq-content hidden border-t border-gray-100 bg-slate-50/50">
                    <div class="p-5 sm:p-6 text-gray-700 text-sm sm:text-base leading-relaxed space-y-2">
                        {{ .answer | markdownify }}
                    </div>
                </div>
            </div>
            {{ end }}
        </div>
    </div>
</section>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
  {{ $len := len $data.questions }}
  {{ range $index, $element := $data.questions }}
    {
      "@type": "Question",
      "name": "{{ $element.question | plainify }}",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "{{ $element.answer | plainify }}"
      }
    }{{ if ne (add $index 1) $len }},{{ end }}
  {{ end }}
  ]
}
</script>
